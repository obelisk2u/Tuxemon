events:

  New Game Setup:
    actions:
    - rename_player player
    - choice_npc appearance_adventurer:appearance_adventurerblack:appearance_adventurer_green:appearance_adventurer_yellow,appearance_choice
    - choice_monster rockitten:cardiling:tweesher,starter_choice
    - add_monster starter_choice,5
    - transition_teleport player,hometown.tmx,20,17,0.3
    - set_variable setup_done:yes
    conditions:
    - not variable_set setup_done:yes
    type: event

  Apply Adventurer:
    actions:
    - set_template player,adventurer,adventurer
    - set_variable appearance_set:yes
    conditions:
    - is variable_set appearance_choice:appearance_adventurer
    - not variable_set appearance_set:yes
    type: event

  Apply Adventurer Black:
    actions:
    - set_template player,adventurerblack,adventurerblack
    - set_variable appearance_set:yes
    conditions:
    - is variable_set appearance_choice:appearance_adventurerblack
    - not variable_set appearance_set:yes
    type: event

  Apply Adventurer Green:
    actions:
    - set_template player,adventurer_green,adventurer_green
    - set_variable appearance_set:yes
    conditions:
    - is variable_set appearance_choice:appearance_adventurer_green
    - not variable_set appearance_set:yes
    type: event

  Apply Adventurer Yellow:
    actions:
    - set_template player,adventurer_yellow,adventurer_yellow
    - set_variable appearance_set:yes
    conditions:
    - is variable_set appearance_choice:appearance_adventurer_yellow
    - not variable_set appearance_set:yes
    type: event
